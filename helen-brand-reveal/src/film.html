<!doctype html>
<html lang="es" data-resolution="@@RES@@">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=@@W@@, height=@@H@@" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-latin-full-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("assets/fonts/fraunces-latin-full-italic.woff2") format("woff2");
        font-weight: 100 900;
        font-style: italic;
      }
      :root {
        --orange: #fea300;
        --green: #072305;
        --beige: #e3d8c5;
        --cream: #f7f4ed;
        --black: #000000;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: @@W@@px;
        height: @@H@@px;
        overflow: hidden;
        background: #072305;
      }
      /* Recoleta stand-in: Fraunces with the soft axis up and the wonky alternates off. */
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--green);
        container-type: size;
        font-family: "Fraunces", Georgia, serif;
        font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 36;
        color: var(--cream);
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      .fill {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .center {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .w,
      .kw,
      .dot {
        display: inline-block;
      }

      /* 1-2 · intro + logo reveal */
      #s-logo {
        background: var(--cream);
      }
      #lg-green {
        background: var(--green);
        clip-path: circle(0% at 50% 50%);
      }
      #lg-svg {
        display: block;
      }

      /* 3 · concept */
      #s-concept {
        background: var(--green);
      }
      .concept {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .headline {
        font-weight: 480;
        font-size: 7.4cqw;
        line-height: 1.05;
        letter-spacing: -0.015em;
        text-align: center;
        max-width: 88cqw;
        color: var(--cream);
      }
      .headline .hl {
        position: relative;
        font-style: italic;
        color: var(--orange);
      }
      .hl-swash {
        position: absolute;
        left: 2%;
        width: 96%;
        bottom: -0.12em;
        height: 0.22em;
        overflow: visible;
      }
      .kw-row {
        position: absolute;
        left: 0;
        right: 0;
        top: 61%;
        text-align: center;
        font-size: 3.1cqw;
        font-weight: 420;
        letter-spacing: 0.01em;
        color: var(--beige);
      }
      .kw-row .dot {
        color: var(--orange);
        margin: 0 0.45em;
      }

      /* 4 · palette */
      #s-palette {
        background: var(--cream);
      }
      .sw {
        position: absolute;
        overflow: hidden;
      }
      .hex {
        position: absolute;
        font-weight: 420;
        font-size: 2.2cqw;
        letter-spacing: 0.32em;
        line-height: 1.2;
        white-space: nowrap;
        display: flex;
      }
      #pal-expand {
        background: var(--orange);
        opacity: 0;
        z-index: 10;
      }

      /* 5 · typography */
      #s-type {
        background: var(--orange);
      }
      .ty {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6cqw;
        color: var(--green);
      }
      .aa-wrap {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .aa {
        font-size: 46cqh;
        line-height: 0.92;
        font-weight: 430;
        letter-spacing: -0.02em;
      }
      .ty-rule {
        width: 100%;
        height: 0.5cqh;
        min-height: 3px;
        background: var(--green);
        transform-origin: 0% 50%;
      }
      .abc {
        display: flex;
        flex-direction: column;
        gap: 1.2cqh;
      }
      .abc .ln {
        display: block;
        font-size: 5.6cqh;
        letter-spacing: 0.14em;
        line-height: 1.15;
        white-space: nowrap;
      }
      .abc .ln.lbl {
        font-size: 2.2cqh;
        letter-spacing: 0.4em;
        font-weight: 520;
        margin-bottom: 1cqh;
      }
      .abc .ln.it {
        font-style: italic;
      }

      /* 6 · patterns + icons */
      #s-hats {
        background: var(--green);
      }
      #s-icons {
        background: var(--beige);
      }
      .persp {
        perspective: 1400px;
        perspective-origin: 50% 50%;
      }
      .plane {
        position: absolute;
        width: 300%;
        height: 300%;
        left: -100%;
        top: -100%;
        background-repeat: repeat;
      }
      #hz-plane {
        background-image: url("assets/brand/pattern-hats-tile.svg");
      }
      #wm-plane {
        background-image: url("assets/brand/pattern-wordmark-tile.svg");
      }
      .grid {
        position: absolute;
        transform-style: preserve-3d;
      }
      .grid-shadow {
        position: absolute;
        inset: 0;
        box-shadow: 0 40px 90px rgba(7, 35, 5, 0.35);
      }
      .cell {
        position: absolute;
        overflow: hidden;
        backface-visibility: hidden;
      }
      .cell img {
        position: absolute;
        display: block;
      }

      /* 7 · food */
      #s-food {
        background: var(--green);
      }
      .shot,
      .win {
        position: absolute;
        overflow: hidden;
      }
      .shot {
        inset: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
      }
      .kb {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .kb img,
      .card img {
        position: absolute;
        display: block;
      }
      .card {
        position: absolute;
        overflow: hidden;
        border-radius: 28px;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.4);
      }
      .fd-scrim {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 52%;
        background: linear-gradient(to top, rgba(7, 35, 5, 0.82), rgba(7, 35, 5, 0));
        opacity: 0;
      }
      .fd-text {
        position: absolute;
        left: 6.2cqw;
        bottom: 8.5cqh;
        font-size: 8.6cqh;
        line-height: 1.04;
        font-weight: 480;
        letter-spacing: -0.01em;
        color: var(--cream);
      }
      .fd-text .line {
        display: block;
        white-space: nowrap;
      }
      .fd-text .it {
        font-style: italic;
        color: var(--orange);
      }

      /* 8 · applications */
      #s-apps {
        background: var(--beige);
      }
      .bcol {
        position: absolute;
        top: 0;
      }
      .tile {
        position: absolute;
        left: 0;
        overflow: hidden;
        border-radius: 22px;
        box-shadow: 0 30px 70px rgba(7, 35, 5, 0.18);
      }
      .tile img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* 9 · closing */
      #s-close {
        background: var(--green);
      }
      .cl-glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 90cqw;
        height: 90cqh;
        margin-left: -45cqw;
        margin-top: -45cqh;
        background: radial-gradient(ellipse at center, rgba(254, 163, 0, 0.22), rgba(254, 163, 0, 0) 60%);
        opacity: 0;
      }
      .cl-tag {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
      }
      .cl-tag .main {
        display: block;
        font-style: italic;
        font-weight: 430;
        font-size: 5.6cqh;
        color: var(--cream);
      }
      .cl-tag .sub {
        display: block;
        margin-top: 2.6cqh;
        font-size: 1.85cqh;
        letter-spacing: 0.42em;
        font-weight: 520;
        color: var(--beige);
      }

      /* modern finish: clean flat colour, no grain/vignette */
      .mk {
        display: inline-block;
        overflow: hidden;
        vertical-align: bottom;
        padding: 0.06em 0.08em 0.2em;
        margin: -0.06em -0.08em -0.2em;
      }
      #wipes {
        position: absolute;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 80;
      }
      .band {
        position: absolute;
        top: -10%;
        height: 120%;
        left: 0;
      }
      .iris {
        position: absolute;
        inset: 0;
        background: var(--green);
        clip-path: circle(0% at 50% 50%);
        z-index: 20;
      }

      /* 9:16 reframe */
      #root.portrait .headline {
        font-size: 11.6cqw;
        max-width: 86cqw;
      }
      #root.portrait .kw-row {
        top: 62%;
        font-size: 6.2cqw;
        line-height: 1.5;
        padding: 0 8cqw;
      }
      #root.portrait .kw-row .dot {
        margin: 0 0.35em;
      }
      #root.portrait .hex {
        font-size: 3.1cqw;
        letter-spacing: 0.16em;
      }
      #root.portrait .ty {
        flex-direction: column;
        gap: 4cqh;
      }
      #root.portrait .aa {
        font-size: 30cqh;
      }
      #root.portrait .abc .ln {
        font-size: 3.15cqh;
      }
      #root.portrait .abc .ln.lbl {
        font-size: 1.4cqh;
      }
      #root.portrait .fd-text {
        left: 7cqw;
        bottom: 9cqh;
        font-size: 5.2cqh;
      }
      #root.portrait .cl-tag .main {
        font-size: 4.2cqh;
      }
      #root.portrait .cl-tag .sub {
        font-size: 1.35cqh;
        letter-spacing: 0.32em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      class="@@ORIENT@@"
      data-composition-id="main"
      data-start="0"
      data-duration="@@END@@"
      data-width="@@W@@"
      data-height="@@H@@"
    >
      <audio id="bgm" src="assets/bgm.mp3" data-start="0" data-duration="@@END@@" data-track-index="11" data-volume="1"></audio>

      <!-- 1-2 · INTRO + LOGO REVEAL -->
      <div id="s-logo" class="scene clip" data-start="@@LOGO_START@@" data-duration="@@LOGO_DUR@@" data-track-index="1">
        <div id="lg-green" class="fill"></div>
        <div id="lg-fade" class="fill">
          <div id="lg-blur" class="fill">
            <div id="lg-zoom" class="fill">
              <div id="lg-push" class="fill">
                <div id="lg-shake" class="fill center">@@LOGO_MAIN@@</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 3 · CONCEPTO -->
      <div id="s-concept" class="scene clip" data-start="@@CONCEPT_START@@" data-duration="@@CONCEPT_DUR@@" data-track-index="2">
        <div id="cz-blur" class="fill">
          <div id="cz-op" class="fill">
            <div id="cz-inner" class="fill concept">
              <div class="headline" id="c-head">
                <span class="w">Mucho</span> <span class="w">más</span> <span class="w">que</span>
                <span class="w">buena</span>
                <span class="w hl"
                  >comida.<svg class="hl-swash" viewBox="0 0 200 20" preserveAspectRatio="none">
                    <path id="c-swash" d="M3 13 C 45 4, 110 3, 197 9" fill="none" stroke="#FEA300" stroke-width="5" stroke-linecap="round" /></svg
                ></span>
              </div>
              <div class="kw-row" id="c-kw">
                <span class="kw">cercana</span><span class="dot">·</span><span class="kw">cálida</span><span class="dot">·</span
                ><span class="kw">casera</span><span class="dot">·</span><span class="kw">alegre</span><span class="dot">·</span
                ><span class="kw">auténtica</span><span class="dot">·</span><span class="kw">familiar</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 4 · PALETA -->
      <div id="s-palette" class="scene clip" data-start="@@PALETTE_START@@" data-duration="@@PALETTE_DUR@@" data-track-index="3">
        <div id="pal-in" class="fill"></div>
        <div id="pal-expand" class="fill"></div>
      </div>

      <!-- 5 · TIPOGRAFÍA -->
      <div id="s-type" class="scene clip" data-start="@@TYPE_START@@" data-duration="@@TYPE_DUR@@" data-track-index="4">
        <div id="ty-blur" class="fill">
          <div id="ty-op" class="fill">
            <div id="ty-inner" class="fill ty">
              <div class="aa-wrap">
                <div class="aa">Aa</div>
                <div class="ty-rule" id="ty-rule"></div>
              </div>
              <div class="abc" id="ty-abc">
                <div class="ln lbl">TIPOGRAFÍA · SERIF CÁLIDA</div>
                <div class="ln">ABCDEFGHIJKLM</div>
                <div class="ln">NOPQRSTUVWXYZ</div>
                <div class="ln">abcdefghijklm</div>
                <div class="ln">nopqrstuvwxyz</div>
                <div class="ln it">0123456789 ¡!¿?&amp;</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 6a · PATRÓN DE GORROS -->
      <div id="s-hats" class="scene clip" data-start="@@HATS_START@@" data-duration="@@HATS_DUR@@" data-track-index="5">
        <div id="hz-in" class="fill">
          <div id="hz-op" class="fill persp">
            <div id="hz-slide" class="fill"><div id="hz-plane" class="plane" data-layout-allow-overflow></div></div>
          </div>
        </div>
      </div>

      <!-- 6b · PATRÓN WORDMARK + GRILLA DE ÍCONOS -->
      <div id="s-icons" class="scene clip" data-start="@@ICONS_START@@" data-duration="@@ICONS_DUR@@" data-track-index="6">
        <div id="gz-fade" class="fill">
          <div id="gz-blur" class="fill">
            <div id="gz-zoom" class="fill">
              <div class="fill persp" style="overflow: hidden">
                <div id="wm-slide" class="fill"><div id="wm-plane" class="plane" data-layout-allow-overflow></div></div>
              </div>
              <div id="grid-persp" class="fill persp">
                <div id="grid" class="grid"><div class="grid-shadow" id="grid-shadow"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 7 · COMIDA -->
      <div id="s-food" class="scene clip" data-start="@@FOOD_START@@" data-duration="@@FOOD_DUR@@" data-track-index="7">
        <div id="fd-whip" class="fill">
          <div id="fd-blur" class="fill">
            <div id="fd-op" class="fill">
              <div id="fd-in" class="fill"></div>
            </div>
          </div>
          <div class="fd-scrim" id="fd-scrim"></div>
          <div class="fd-text" id="fd-text">
            <span class="line"><span class="w">Hecho</span> <span class="w">con</span> <span class="w">amor,</span></span>
            <span class="line it"><span class="w">como</span> <span class="w">en</span> <span class="w">casa.</span></span>
          </div>
        </div>
      </div>

      <!-- 8 · APLICACIONES -->
      <div id="s-apps" class="scene clip" data-start="@@APPS_START@@" data-duration="@@APPS_DUR@@" data-track-index="8">
        <div id="ap-op" class="fill">
          <div id="ap-pull" class="fill">
            <div id="ap-in" class="fill">
              <div id="ap-zoom" class="fill">
                <div class="fill persp" style="perspective: 2200px">
                  <div id="bento" class="fill"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="iris" id="ap-iris"></div>
      </div>

      <!-- 9 · CIERRE -->
      <div id="s-close" class="scene clip" data-start="@@CLOSE_START@@" data-duration="@@CLOSE_DUR@@" data-track-index="9">
        <div class="cl-glow" id="cl-glow"></div>
        <div id="cl-blur" class="fill">
          <div id="cl-op" class="fill">
            <div id="cl-pulse" class="fill center">@@LOGO_CLOSE@@</div>
            <div class="cl-tag" id="cl-tag">
              <span class="main"><span class="w">Catering</span> <span class="w">a</span> <span class="w">medida</span></span>
              <span class="sub" id="cl-sub">SABORES QUE HACEN MOMENTOS ESPECIALES</span>
            </div>
          </div>
        </div>
      </div>

      <div id="wipes"></div>
    </div>

    <script>
      (function () {
        const root = document.getElementById("root");
        const W = @@W@@;
        const H = @@H@@;
        const P = H > W;
        const BEAT = 60 / 108;
        const FPS = 30;
        const E8 = BEAT / 2;
        const E16 = BEAT / 4;
        // Beat-grid clock: bar is 1-based, beat 0-based; snapped to frames like tools/build.py.
        const T = (bar, beat = 0) => Math.round(((bar - 1) * 4 + beat) * BEAT * FPS) / FPS;
        const $ = (s, r = document) => r.querySelector(s);
        const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

        const tl = gsap.timeline({ paused: true });

        // ------------------------------------------------------------------ helpers
        // cut-the-curve exit to the LEFT (the film's current), ending exactly on the cut
        function exitLeft(el, cut, dist = 230) {
          tl.to(el, { x: -dist, duration: 0.34, ease: "power4.in" }, cut - 0.34);
          tl.to(el, { opacity: 0, duration: 0.2, ease: "none" }, cut - 0.22);
        }
        // cut-the-curve entry from the right, igniting mid-path at 0.35 opacity
        function enterLeft(el, cut, dist = 230, dur = 0.36) {
          tl.fromTo(el, { x: dist }, { x: 0, duration: dur, ease: "power4.out" }, cut);
          tl.fromTo(el, { opacity: 0.35 }, { opacity: 1, duration: 0.2, ease: "none" }, cut);
        }
        // modern kinetic type: each word slides up from behind its own line mask
        function mask(el) {
          const m = document.createElement("span");
          m.className = "mk";
          el.parentNode.insertBefore(m, el);
          m.appendChild(el);
          return el;
        }
        function rise(el, t, dur = 0.6) {
          mask(el);
          gsap.set(el, { yPercent: 118 });
          tl.to(el, { yPercent: 0, duration: dur, ease: "expo.out" }, t);
        }
        // brand panel wipe: skewed colour bands sweep right-to-left (the current), expo.inOut,
        // fully covering the frame on the cut so the scene swap happens under cover
        const wipes = $("#wipes");
        function panelWipe(cut, colors, D = 0.82, stagger = 0.065) {
          const bw = 1.7 * W;
          const n = colors.length;
          colors.forEach((c, i) => {
            const b = document.createElement("div");
            b.className = "band";
            Object.assign(b.style, { width: bw + "px", background: c, zIndex: String(i + 1) });
            wipes.appendChild(b);
            gsap.set(b, { skewX: -14, x: W + 0.2 * W });
            const start = cut - D / 2 - (n - 1 - i) * stagger;
            tl.to(b, { x: -bw - 0.2 * W, duration: D, ease: "expo.inOut" }, start);
          });
        }
        // image placed to cover a window, centred on a focal point
        function coverImg(src, iw, ih, ww, wh, fx = 0.5, fy = 0.5, over = 1.06) {
          const s = Math.max(ww / iw, wh / ih) * over;
          const w = iw * s;
          const h = ih * s;
          let left = ww / 2 - fx * w;
          let top = wh / 2 - fy * h;
          left = Math.min(0, Math.max(ww - w, left));
          top = Math.min(0, Math.max(wh - h, top));
          const img = document.createElement("img");
          img.src = src;
          img.alt = "";
          img.setAttribute("data-layout-allow-overflow", "");
          Object.assign(img.style, { width: w + "px", height: h + "px", left: left + "px", top: top + "px" });
          return img;
        }

        // ================================================================== 1-2 INTRO + LOGO
        const LOGO_W = (P ? 0.84 : 0.573) * W;
        const k = LOGO_W / 287.396; // px per logo unit
        const hat = $("#lg-hat");
        const HAT_C = [314.595, 300.426];
        const LOGO_C = [252.515, 332.275];
        const hatScale0 = ((P ? 0.6 : 0.33) * W) / (75.56 * k);
        gsap.set(hat, {
          svgOrigin: HAT_C.join(" "),
          x: LOGO_C[0] - HAT_C[0],
          y: LOGO_C[1] - HAT_C[1] - 4,
          scale: hatScale0,
        });
        $$(".lg-hatfill").forEach((p) => gsap.set(p, { opacity: 0 }));
        const strokes = $$(".lg-hatstroke");
        strokes.forEach((p) => {
          const L = p.getTotalLength();
          gsap.set(p, { strokeDasharray: L + " " + L, strokeDashoffset: L, attr: { "data-len": L } });
        });
        // the isotipo draws itself on the first golpes: kick/clap on every beat of bars 1-2
        for (let b = 0; b < 7; b++) {
          const t = T(1, 0) + b * BEAT;
          strokes.forEach((p) => {
            const L = parseFloat(p.getAttribute("data-len"));
            tl.to(p, { strokeDashoffset: L * (1 - (b + 1) / 7), duration: 0.42, ease: "power3.out" }, t);
          });
        }
        // snare pickup (bar 2, beat 4): ink floods in on the 16ths, then the hat flies to the "e"
        tl.to(".lg-hatfill", { opacity: 1, duration: BEAT * 0.7, ease: "power2.inOut" }, T(2, 3));
        tl.to(hat, { x: 0, y: 0, scale: 1, duration: T(3) - T(2, 3) - 0.04, ease: "power3.in" }, T(2, 3) + 0.04);
        // landing on the crash: small rebound, no deformation
        tl.to(hat, { y: -3.4, duration: 0.13, ease: "power2.out" }, T(3));
        tl.to(hat, { y: 0, duration: 0.19, ease: "power2.in" }, T(3) + 0.13);
        tl.to(hat, { y: -0.9, duration: 0.08, ease: "power1.out" }, T(3) + 0.32);
        tl.to(hat, { y: 0, duration: 0.1, ease: "power1.in" }, T(3) + 0.4);
        tl.fromTo("#lg-shake", { y: 0 }, { y: 7, duration: 0.06, ease: "power2.out", immediateRender: false }, T(3));

        const TIDX = 3;
        const TWD = P ? 300 : 380;
        const GAP = P ? 20 : 26;
        const nC = COLS.length;
        const x0 = (W - (nC * TWD + (nC - 1) * GAP)) / 2;
        const bento = $("#bento");
        const tiles = [];
        let hero = null;
        COLS.forEach((list, c) => {
          const col = document.createElement("div");
          col.className = "bcol";
          Object.assign(col.style, { left: x0 + c * (TWD + GAP) + "px", width: TWD + "px" });
          let y = 0;
          list.forEach((name, r) => {
            const [iw, ih, lx, ly] = MOCK[name];
            const th = (TWD * ih) / iw;
            const t = document.createElement("div");
            t.className = "tile";
            Object.assign(t.style, { top: y + "px", width: TWD + "px", height: th + "px" });
            const img = document.createElement("img");
            img.src = `assets/img/${name}.jpg`;
            img.alt = "";
            t.appendChild(img);
            col.appendChild(t);
            tiles.push({ t, img, c, top: y });
            if (c === TCOL && r === TIDX) hero = { top: y, h: th, lx, ly };
            y += th + GAP;
          });
          col.dataset.h = String(y);
          bento.appendChild(col);
        });
        const cols = $$(".bcol", bento);
        // the hero column decelerates so the shop-window logo parks dead centre for the fly-in
        const heroLogoY = hero.top + hero.ly * hero.h;
        const heroEndY = H / 2 - heroLogoY;
        const parkT = T(20);
        cols.forEach((col, c) => {
          if (c === TCOL) {
            tl.fromTo(col, { y: heroEndY + 0.3 * H }, { y: heroEndY, duration: parkT - T(18), ease: "power2.out" }, T(18));
          } else {
            const dir = c % 2 === 0 ? -1 : 1;
            const base = -0.3 * H;
            tl.fromTo(col, { y: base - dir * 0.12 * H }, { y: base + dir * 0.12 * H, duration: T(21) - T(18), ease: "none" }, T(18));
          }
        });
        // tiles open with a rounded mask on the 32nds, starting with what is on screen at the cut
        const colY0 = (c) => (c === TCOL ? heroEndY + 0.3 * H : -0.3 * H - (c % 2 === 0 ? -1 : 1) * 0.12 * H);
        tiles
          .map((o) => ({ ...o, sy: colY0(o.c) + o.top, sh: o.t.offsetHeight }))
          .sort((a, b) => {
            const va = a.sy + a.sh > 0 && a.sy < H ? 0 : 1;
            const vb = b.sy + b.sh > 0 && b.sy < H ? 0 : 1;
            return va - vb || a.sy - b.sy || a.c - b.c;
          })
          .forEach((o, i) => {
            const t = T(18) + 0.02 + i * (E16 / 2);
            tl.fromTo(o.t, { clipPath: "inset(100% 0% 0% 0% round 22px)" }, { clipPath: "inset(0% 0% 0% 0% round 22px)", duration: 0.6, ease: "expo.out", immediateRender: true }, t);
            tl.fromTo(o.img, { scale: 1.25 }, { scale: 1, duration: 0.9, ease: "expo.out", immediateRender: true }, t);
          });
        // camera with intent: the table-top plane straightens while the wall builds
        tl.fromTo(bento, { rotationX: 26, rotationZ: -7, scale: 0.9 }, { rotationX: 0, rotationZ: 0, scale: 1, duration: parkT - T(18), ease: "power2.inOut" }, T(18));
        // fly into the shop window until it fills the frame, landing on bar 20 beat 3
        const heroX = x0 + TCOL * (TWD + GAP) + hero.lx * TWD;
        // scale so the shop window covers the frame on every side of its (centred) logo
        const fillS =
          1.04 *
          Math.max(W / 2 / (hero.lx * TWD), W / 2 / ((1 - hero.lx) * TWD), H / 2 / (hero.ly * hero.h), H / 2 / ((1 - hero.ly) * hero.h));
        gsap.set("#ap-zoom", { transformOrigin: `${heroX}px ${H / 2}px` });
        tl.to("#ap-zoom", { x: W / 2 - heroX, scale: fillS, duration: T(20, 2) - parkT, ease: "expo.inOut" }, parkT);
        tl.to("#ap-zoom", { scale: fillS * 1.06, duration: T(21) - T(20, 2), ease: "none" }, T(20, 2));
        // the wall slides in from the right under the panel wipe
        tl.fromTo("#ap-in", { x: 0.25 * W }, { x: 0, duration: 0.6, ease: "expo.out" }, T(18));
        // green iris opens from the shop-window logo (dead centre) and becomes the closing ground
        tl.to("#ap-pull", { scale: 1.12, duration: 0.5, ease: "expo.in" }, T(21) - 0.5);
        tl.to("#ap-iris", { clipPath: "circle(80% at 50% 50%)", duration: 0.5, ease: "expo.in" }, T(21) - 0.5);

        // ================================================================== 9 CIERRE
        tl.fromTo("#cl-blur", { scale: 1.22, filter: "blur(4px)" }, { scale: 1, filter: "blur(0px)", duration: 0.8, ease: "expo.out" }, T(21));
        tl.fromTo("#cl-op", { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "none" }, T(21));
        const clW = (P ? 0.8 : 0.51) * W;
        const clH = clW * (119.929 / 287.396);
        $("#cl-tag").style.top = H / 2 + clH / 2 + (P ? 0.03 : 0.055) * H + "px";
        $$("#cl-tag .w").forEach((w, i) => rise(w, T(21, 1) + i * E8, 0.6));
        rise($("#cl-sub"), T(21, 2.5), 0.6);
        // band pickup on beat 4 / 4&: the mark gathers, then the last golpe releases it
        [T(21, 3), T(21, 3.5)].forEach((t) => {
          tl.to("#cl-pulse", { scale: 0.975, duration: 0.07, ease: "power2.out" }, t);
          tl.to("#cl-pulse", { scale: 1, duration: 0.12, ease: "power2.inOut" }, t + 0.07);
        });
        tl.to("#cl-pulse", { scale: 1.065, duration: 0.07, ease: "power2.out" }, T(22));
        tl.to("#cl-pulse", { scale: 1, duration: 0.6, ease: "power3.out" }, T(22) + 0.07);
        tl.fromTo("#cl-glow", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1.1, duration: 0.12, ease: "power2.out", immediateRender: false }, T(22));
        tl.to("#cl-glow", { opacity: 0.35, scale: 1.25, duration: 1.1, ease: "power2.out" }, T(22) + 0.12);

        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
